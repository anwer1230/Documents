# =============================================================================
# monitoring/alerts.yaml — سياسات التنبيه لـ Google Cloud Monitoring
# =============================================================================

# 1. فشل النسخ الاحتياطي
# -----------------------------------------------------------------------------
- displayName: "[P1] Backup Job Failure — Telegram App"
  documentation:
    content: |
      فشلت عملية النسخ الاحتياطي لقاعدة بيانات Telegram.
      **الإجراء المطلوب:**
      1. افحص السجلات: `gcloud logging read 'jsonPayload.msg=~"فشل النسخ"' --limit 20`
      2. راجع دليل العمليات: `docs/RUNBOOK.md#استعادة-النسخ-الاحتياطي`
      3. شغّل فحص يدوي: `/opt/telegram/scripts/backup.sh --dry-run`
    mimeType: "text/markdown"
  userLabels:
    severity: "critical"
    service: "telegram-web"
    component: "backup"
  conditions:
    - displayName: "Backup Log Error Present"
      conditionMatchedLog:
        filter: |
          resource.type="cloud_run_revision"
          textPayload=~"Backup failed" OR jsonPayload.status="FAILURE"
  alertStrategy:
    notificationRateLimit:
      period: "3600s" # تنبيه واحد لكل ساعة لتجنب الإزعاج
    autoClose: "86400s"

# 2. ارتفاع معدل أخطاء 5xx
# -----------------------------------------------------------------------------
- displayName: "[P1] High 5xx Error Rate (> 2%)"
  documentation:
    content: |
      معدل أخطاء HTTP 5xx تجاوز 2% من إجمالي الطلبات خلال 5 دقائق.
      **الإجراء:**
      1. فحص صحة الخدمة: `/api/health`
      2. مراجعة استهلاك الذاكرة والمعالج
      3. التحقق من وجود هجمات أو أخطاء في قاعدة البيانات
    mimeType: "text/markdown"
  userLabels:
    severity: "critical"
    service: "telegram-web"
  conditions:
    - displayName: "5xx rate > 2%"
      conditionThreshold:
        filter: |
          resource.type="cloud_run_revision"
          metric.type="run.googleapis.com/request_count"
          metric.labels.response_code_class="5xx"
        aggregations:
          - alignmentPeriod: "60s"
            perSeriesAligner: "ALIGN_RATE"
            crossSeriesReducer: "REDUCE_SUM"
        comparison: "COMPARISON_GT"
        thresholdValue: 0.02
        duration: "300s"
        trigger:
          count: 1

# 3. ارتفاع وقت الاستجابة (Latency P99 > 1500ms)
# -----------------------------------------------------------------------------
- displayName: "[P2] High P99 Latency (> 1.5s)"
  documentation:
    content: |
      زمن استجابة P99 تجاوز 1500ms لمدة 5 دقائق متواصلة.
      قد يشير إلى اختناق في WebSocket أو قفل في SQLite.
    mimeType: "text/markdown"
  userLabels:
    severity: "warning"
    service: "telegram-web"
  conditions:
    - displayName: "P99 Latency > 1500ms"
      conditionThreshold:
        filter: |
          resource.type="cloud_run_revision"
          metric.type="run.googleapis.com/request_latencies"
        aggregations:
          - alignmentPeriod: "60s"
            perSeriesAligner: "ALIGN_PERCENTILE_99"
        comparison: "COMPARISON_GT"
        thresholdValue: 1500
        duration: "300s"

# 4. فشل فحص الصحة (/api/health)
# -----------------------------------------------------------------------------
- displayName: "[P0] Health Check Failing"
  documentation:
    content: |
      الخدمة لا تستجيب على `/api/health`. الخدمة متوقفة بالكامل.
      **إجراء فوري:** تصعيد إلى المهندس المناوب وإعادة تشغيل الحاوية.
    mimeType: "text/markdown"
  userLabels:
    severity: "emergency"
    service: "telegram-web"
  conditions:
    - displayName: "Uptime Check Health Failing"
      conditionThreshold:
        filter: |
          resource.type="uptime_url"
          metric.type="monitoring.googleapis.com/uptime_check/check_passed"
        aggregations:
          - alignmentPeriod: "60s"
            perSeriesAligner: "ALIGN_NEXT_OLDER"
        comparison: "COMPARISON_LT"
        thresholdValue: 1
        duration: "120s"

# 5. تنبيه محاولات تسجيل دخول مشبوهة (Brute-Force Detection)
# -----------------------------------------------------------------------------
- displayName: "[P2] Potential Brute-Force Activity"
  documentation:
    content: |
      تم رصد أكثر من 50 محاولة تسجيل دخول فاشلة من نفس النطاق خلال 5 دقائق.
      يجب مراجعة عناوين IP وتطبيق الحظر إذا لزم الأمر.
    mimeType: "text/markdown"
  userLabels:
    severity: "warning"
    service: "telegram-web"
    component: "auth"
  conditions:
    - displayName: "Failed Logins > 50 in 5m"
      conditionMatchedLog:
        filter: |
          resource.type="cloud_run_revision"
          textPayload=~"Auth failed" OR jsonPayload.event="AUTH_FAILURE"
