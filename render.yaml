services:
  - type: web
    name: abu-malk-services
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: TELEGRAM_API_ID
        value: "22043994"
      - key: TELEGRAM_API_HASH
        value: "56f64582b363d367280db96586b97801"
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDER
        value: "true"
