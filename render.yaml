services:
  - type: web
    name: telegram-web
    runtime: node
    plan: free
    region: frankfurt # or oregon / ohio / singapore
    buildCommand: npm ci --prefer-offline --no-audit && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: TELEGRAM_API_ID
        value: "22043994"
      - key: TELEGRAM_API_HASH
        value: "56f64582b363d367280db96586b97801"
      - key: VAPID_PUBLIC_KEY
        value: "BE36BmheMRx2GxzjWpp_4bmXq_hZg55bP_M_vNVysfnjTxns9VCI0hiCHgnRBxOURe_LoxWaAgrS9G9QZbQhOh8"
      - key: VAPID_PRIVATE_KEY
        value: "13NU1_GmeL7bDQcVtlFyuKqsnnsX3Xk0yE--2rAQJw4"
      - key: VAPID_SUBJECT
        value: "mailto:anwerfoud80@gmail.com"
      - key: WS_STRICT_MODE
        value: "true"
      - key: COOKIE_STRICT_MODE
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: RATE_LIMIT_HTTP_PER_MIN
        value: "120"
      - key: RATE_LIMIT_HTTP_WRITE_PER_MIN
        value: "30"
      - key: LOG_LEVEL
        value: "info"
      - key: ALLOWED_ORIGINS
        sync: false # Set this to your Render service URL e.g. https://telegram-web.onrender.com
      - key: GEMINI_API_KEY
        sync: false # Optional: inject if using AI studio features
