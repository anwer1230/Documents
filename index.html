    <meta property="og:title" content="Telegram_Anwer" />
    <meta property="og:description" content="تطبيق تيليجرام الرسمي المتقدم (Telegram_Anwer) مع دعم تثبيت التطبيق المباشر كـ APK و PWA، والمزامنة السحابية عبر Firebase، ومحادثات وقنوات ومكالمات ورسائل صوتية، وشريط الأدوات الذكية المكون من 9 وظائف أتمتة وهندسة متقدمة مع الذكاء الاصطناعي." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2481cc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telegram" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/telegram-logo.svg" />
    <link rel="icon" type="image/png" href="https://telegram.org/img/t_logo.png" />
    <link rel="apple-touch-icon" href="/telegram-logo.svg" />
    <script>
      // Anti-Corrupted Cache & Emergency Reset Helper
      (function() {
        try {
          // If a hard reset parameter is present, flush caches completely
          if (window.location.search.includes('reset=')) {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
          }
          // Validate basic JSON parsability of critical local storage keys
          var testKeys = ['tg_multi_accounts_v3', 'app_settings', 'draft_message'];
          testKeys.forEach(function(k) {
            var val = localStorage.getItem(k);
            if (val && val.startsWith('{') || (val && val.startsWith('['))) {
              try { JSON.parse(val); } catch(e) { localStorage.removeItem(k); }
            }
          });
        } catch(err) {
          console.warn('Storage validation warning:', err);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
