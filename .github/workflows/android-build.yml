name: Build Telegram Anwer APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore & Signing Config
        run: |
          mkdir -p TMessagesProj/config
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > TMessagesProj/config/debug.keystore
            cp TMessagesProj/config/debug.keystore TMessagesProj/config/release.keystore
          elif [ ! -f TMessagesProj/config/release.keystore ]; then
            keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore \
              -alias Telegram_anwer -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 772997043aa -keypass 772997043aa \
              -dname "CN=Telegram Anwer, OU=Mobile, O=Telegram, L=City, S=State, C=US"
            cp TMessagesProj/config/release.keystore TMessagesProj/config/debug.keystore
          fi

      - name: Verify google-services.json
        run: |
          if [ ! -f TMessagesProj/google-services.json ] && [ -f google-services.json ]; then
            cp google-services.json TMessagesProj/google-services.json
          fi

      - name: Build APK (Debug & Release)
        run: |
          gradle :TMessagesProj:assembleDebug :TMessagesProj:assembleRelease --stacktrace

      - name: Find & Organize APK Files
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp -v {} output_apks/ \;
          echo "Generated APK files:"
          ls -la output_apks/

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Anwer-APKs
          path: output_apks/*.apk
          retention-days: 14
          if-no-files-found: error
